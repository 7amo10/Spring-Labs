spring.application.name=week-10-aop-security-audit-execution-profiler

# Spring Boot 4 / Spring Framework 7 Built-In API Versioning
# Directs Spring MVC to extract the version token from the 1st path segment of /api/{version}/...
spring.mvc.apiversion.use.path-segment=1

# Production Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging configuration
logging.level.com.spring.lab.aop=DEBUG
