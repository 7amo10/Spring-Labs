# Server Port
server.port=8080

# Application Name
spring.application.name=student-information-system

# MySQL Database Connection (Production Profile)
spring.datasource.url=jdbc:mysql://localhost:3306/student_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=springstudent
spring.datasource.password=springstudent

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
