#
# JDBC Configuration for MySQL (employee_directory database)
#
spring.datasource.url=jdbc:mysql://localhost:3306/employee_directory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=springstudent
spring.datasource.password=springstudent

#
# Hibernate / JPA Configuration
#
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#
# Actuator Configuration
#
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

#
# Spring Security Debug Logging
#
logging.level.org.springframework.security=DEBUG
