# Server Configuration
server.port=8080

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Custom Application Business Properties (Injected via @Value and @ConfigurationProperties)
coach.name=Coach Carter
team.name=Apex Raptors
app.environment=production-us-east
cluster.node.id=node-omega-01
cluster.region=us-east-1

# Application Info Properties
info.app.name=Enterprise Service Metadata & Health Gateway
info.app.description=Spring Boot 3 Week 01 Architectural Laboratory
info.app.version=1.0.0
