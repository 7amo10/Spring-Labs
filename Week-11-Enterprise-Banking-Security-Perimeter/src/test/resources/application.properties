spring.application.name=week-11-enterprise-banking-security-perimeter-test

# H2 In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:bankdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test Logging Configuration
logging.level.com.spring.lab.security=DEBUG
logging.level.org.springframework.security=INFO
