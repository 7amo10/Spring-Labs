<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Staff Administration Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand-custom {
            font-weight: 700;
            color: #ffffff !important;
            letter-spacing: -0.5px;
        }
        .header-section {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 24px 0;
            margin-bottom: 24px;
        }
    </style>
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #184c78;">
    <div class="container">
        <a class="navbar-brand navbar-brand-custom" th:href="@{/staff/list}">
            Enterprise Staff Portal
        </a>

        <div class="d-flex align-items-center gap-3">
            <span class="text-white-50 small">
                Logged in as: <strong class="text-white" sec:authentication="name"></strong>
                (<span class="badge bg-light text-dark" sec:authentication="principal.authorities"></span>)
            </span>

            <!-- Secure POST Logout Form with CSRF protection -->
            <form th:action="@{/logout}" method="POST" class="d-inline mb-0">
                <button type="submit" class="btn btn-outline-light btn-sm fw-semibold">
                    Sign Out
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- Page Header & Action Controls -->
<div class="header-section">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h3 class="fw-bold mb-1 text-dark">Staff Directory</h3>
            <p class="text-muted mb-0 small">Manage organizational personnel, departmental assignments, and credentials</p>
        </div>

        <!-- Add Button: Displayed strictly for MANAGER or ADMIN roles -->
        <div sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">
            <a th:href="@{/staff/addForm}" class="btn btn-success fw-semibold px-3" style="background-color: #2b542c; border-color: #2b542c;">
                + Add Staff Member
            </a>
        </div>
    </div>
</div>

<!-- Main Table Container -->
<div class="container mb-5">
    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark" style="background-color: #0f172a;">
                <tr>
                    <th class="py-3 px-4" style="width: 8%;">ID</th>
                    <th class="py-3" style="width: 22%;">Full Name</th>
                    <th class="py-3" style="width: 28%;">Email Address</th>
                    <th class="py-3" style="width: 22%;">Department</th>
                    <th class="py-3 px-4 text-end" style="width: 20%;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="staff : ${staffList}">
                    <td class="py-3 px-4 text-muted fw-semibold" th:text="${staff.id}"></td>
                    <td class="py-3">
                        <strong th:text="${staff.firstName + ' ' + staff.lastName}"></strong>
                    </td>
                    <td class="py-3 text-secondary" th:text="${staff.email}"></td>
                    <td class="py-3">
                        <span class="badge bg-info text-dark" th:text="${staff.department != null ? staff.department : 'General Staff'}"></span>
                    </td>
                    <td class="py-3 px-4 text-end">
                        <!-- Update Action: Permitted for MANAGER and ADMIN -->
                        <a sec:authorize="hasAnyRole('MANAGER', 'ADMIN')"
                           th:href="@{/staff/editForm(staffId=${staff.id})}"
                           class="btn btn-outline-primary btn-sm me-1 fw-semibold">
                            Edit
                        </a>

                        <!-- Delete Action: Permitted strictly for ADMIN -->
                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/staff/delete}"
                              method="POST"
                              class="d-inline"
                              onsubmit="return confirm('Are you sure you want to delete this staff record?');">
                            <input type="hidden" name="staffId" th:value="${staff.id}" />
                            <button type="submit" class="btn btn-outline-danger btn-sm fw-semibold">
                                Delete
                            </button>
                        </form>

                        <!-- Read-Only Badge for base EMPLOYEE role -->
                        <span sec:authorize="!hasAnyRole('MANAGER', 'ADMIN')" class="badge bg-secondary">
                            View Only
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
